name: Review - xattr id consumer limits

on:
  push:
    branches:
      - staging/xattr-id-table-size

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Apply review correction
        run: |
          git apply --check staging/review/xattr-id-table-limits.patch
          git apply staging/review/xattr-id-table-limits.patch

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zlib1g-dev liblzma-dev liblzo2-dev liblz4-dev libzstd-dev

      - name: Build squashfs-tools
        working-directory: squashfs-tools
        run: make -j2

      - name: Check xattr count and allocation boundaries
        run: |
          cat > /tmp/xattr-id-limits.c <<'EOF'
          #include <assert.h>
          #include <limits.h>
          #include <stdint.h>

          static int supported(uint64_t ids, uint64_t size_max)
          {
              uint64_t bytes;

              if(ids > INT_MAX)
                  return 0;
              bytes = ids * 16ULL;
              return bytes <= size_max;
          }

          int main(void)
          {
              assert(supported((uint64_t) INT_MAX, UINT64_MAX));
              assert(!supported((uint64_t) INT_MAX + 1, UINT64_MAX));

              assert(supported(0x0fffffffULL, UINT32_MAX));
              assert(!supported(0x10000000ULL, UINT32_MAX));
              assert(!supported(0xffffffffULL, UINT32_MAX));
              return 0;
          }
          EOF
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined \
            /tmp/xattr-id-limits.c -o /tmp/xattr-id-limits
          /tmp/xattr-id-limits

      - name: Promote exact tested correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add squashfs-tools/read_xattrs.c
          git commit -m "read_xattrs: bound xattr id table consumers"
          git push
