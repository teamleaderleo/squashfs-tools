name: Staging - large regular file block count

on:
  push:
    branches:
      - staging/lreg-block-count

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check and apply prospective patch
        run: |
          git apply --check staging/proposals/lreg-block-count.patch
          git apply staging/proposals/lreg-block-count.patch

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zlib1g-dev liblzma-dev liblzo2-dev liblz4-dev libzstd-dev

      - name: Build squashfs-tools
        working-directory: squashfs-tools
        run: make -j2

      - name: Check large-file block boundaries
        run: |
          cat > /tmp/lreg-block-count.c <<'EOF'
          #include <assert.h>
          #include <limits.h>
          #include <stdint.h>

          static int block_count(uint64_t file_size, uint32_t block_size,
                                 unsigned int block_log, int has_fragment,
                                 int *out)
          {
              uint64_t blocks = file_size >> block_log;

              if(!has_fragment && file_size % block_size)
                  blocks++;
              if(blocks > INT_MAX)
                  return 0;

              *out = (int) blocks;
              return 1;
          }

          int main(void)
          {
              int blocks;

              assert(block_count(0x7fffffff000ULL, 4096, 12, 0, &blocks));
              assert(blocks == INT_MAX);
              assert(!block_count(0x80000000000ULL, 4096, 12, 0, &blocks));
              assert(!block_count((uint64_t) LLONG_MAX, 4096, 12, 0, &blocks));
              return 0;
          }
          EOF
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined /tmp/lreg-block-count.c -o /tmp/lreg-block-count
          /tmp/lreg-block-count

      - name: Promote tested source change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add squashfs-tools/unsquash-3.c squashfs-tools/unsquash-4.c
          git commit -m "Unsquash: bound large regular file block count"
          git push
