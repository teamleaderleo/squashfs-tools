name: Review - xattr ID native 32-bit

on:
  push:
    branches:
      - staging/xattr-id-table-size

permissions:
  contents: read

jobs:
  validate-32bit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install 32-bit toolchain and libraries
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y \
            gcc-multilib libc6-dev-i386 \
            zlib1g-dev:i386 liblzma-dev:i386 liblzo2-dev:i386 \
            liblz4-dev:i386 libzstd-dev:i386

      - name: Build squashfs-tools for 32-bit ABI
        working-directory: squashfs-tools
        run: |
          make clean
          make -j2 CC='gcc -m32'
          file unsquashfs mksquashfs

      - name: Verify native xattr consumer boundaries
        run: |
          cat > /tmp/xattr-native32.c <<'EOF'
          #include <assert.h>
          #include <limits.h>
          #include <stddef.h>
          #include <stdint.h>

          static int supported(uint32_t ids)
          {
              long long bytes;

              if(ids > INT_MAX)
                  return 0;

              bytes = (long long) ids * 16;
              if((long long) (size_t) bytes != bytes)
                  return 0;

              return 1;
          }

          int main(void)
          {
              _Static_assert(sizeof(size_t) == 4, "expected native 32-bit size_t");
              assert(supported(0x0fffffffU));
              assert(!supported(0x10000000U));
              assert(!supported((uint32_t) INT_MAX));
              assert(!supported((uint32_t) INT_MAX + 1U));
              return 0;
          }
          EOF
          gcc -m32 -std=c11 -Wall -Wextra -Werror \
            -fsanitize=address,undefined /tmp/xattr-native32.c \
            -o /tmp/xattr-native32
          /tmp/xattr-native32
