name: Review - fragment table native 32-bit

on:
  push:
    branches:
      - staging/fragment-table-size

permissions:
  contents: read

jobs:
  validate-32bit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install 32-bit toolchain and libraries
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y \
            gcc-multilib libc6-dev-i386 \
            zlib1g-dev:i386 liblzma-dev:i386 liblzo2-dev:i386 \
            liblz4-dev:i386 libzstd-dev:i386

      - name: Build squashfs-tools for 32-bit ABI
        working-directory: squashfs-tools
        run: |
          make clean
          make -j2 CC='gcc -m32'
          file unsquashfs mksquashfs

      - name: Verify native size_t boundary and candidate predicate
        run: |
          cat > /tmp/fragment-table-native32.c <<'EOF'
          #include <assert.h>
          #include <stddef.h>
          #include <stdint.h>

          static int representable(long long bytes)
          {
              return (long long) (size_t) bytes == bytes;
          }

          int main(void)
          {
              long long v2 = 0x100000008LL;
              long long v34 = 0x100000010LL;

              _Static_assert(sizeof(size_t) == 4, "expected native 32-bit size_t");
              assert((size_t) v2 == 8);
              assert((size_t) v34 == 16);
              assert(!representable(v2));
              assert(!representable(v34));
              assert(representable(0xfffffff0LL));
              return 0;
          }
          EOF
          gcc -m32 -std=c11 -Wall -Wextra -Werror \
            -fsanitize=address,undefined /tmp/fragment-table-native32.c \
            -o /tmp/fragment-table-native32
          /tmp/fragment-table-native32
