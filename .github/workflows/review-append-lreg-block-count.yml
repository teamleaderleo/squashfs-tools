name: Review - append LREG block count

on:
  push:
    branches:
      - staging/append-lreg-block-count

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Apply prospective correction
        run: |
          git apply --check staging/review/append-lreg-block-count.patch
          git apply staging/review/append-lreg-block-count.patch

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zlib1g-dev liblzma-dev liblzo2-dev liblz4-dev libzstd-dev

      - name: Build squashfs-tools
        working-directory: squashfs-tools
        run: make -j2

      - name: Check append block-list bounds
        run: |
          cat > /tmp/append-lreg-bound.c <<'EOF'
          #include <assert.h>
          #include <limits.h>
          #include <stdint.h>

          static int block_count(uint64_t file_size, uint32_t block_size,
                                 unsigned int block_log, int has_fragment,
                                 int *out)
          {
              uint64_t blocks = file_size >> block_log;

              if(!has_fragment && file_size % block_size)
                  blocks++;
              if(blocks > INT_MAX / sizeof(unsigned int))
                  return 0;

              *out = (int) blocks;
              return 1;
          }

          int main(void)
          {
              const uint64_t max_blocks = INT_MAX / sizeof(unsigned int);
              const uint64_t block_size = 4096;
              int blocks;

              assert(block_count(max_blocks * block_size, block_size, 12, 0, &blocks));
              assert((uint64_t) blocks * sizeof(unsigned int) <= INT_MAX);
              assert(block_count(max_blocks * block_size + 1, block_size, 12, 1, &blocks));
              assert(!block_count(max_blocks * block_size + 1, block_size, 12, 0, &blocks));
              assert(!block_count((uint64_t) LLONG_MAX, block_size, 12, 0, &blocks));
              return 0;
          }
          EOF
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined \
            /tmp/append-lreg-bound.c -o /tmp/append-lreg-bound
          /tmp/append-lreg-bound

      - name: Promote exact tested source change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add squashfs-tools/read_fs.c
          git commit -m "mksquashfs: bound appended large file block list"
          git push
