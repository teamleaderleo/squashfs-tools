name: Staging - fragment index boundary

on:
  push:
    branches:
      - staging/fragment-index-boundary

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check and apply prospective patch
        run: |
          git apply --check staging/proposals/fragment-index-boundary.patch
          git apply staging/proposals/fragment-index-boundary.patch

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zlib1g-dev liblzma-dev liblzo2-dev liblz4-dev libzstd-dev

      - name: Build squashfs-tools
        working-directory: squashfs-tools
        run: make -j2

      - name: Check fragment-count boundary
        run: |
          cat > /tmp/fragment-boundary.c <<'EOF'
          #include <assert.h>
          #include <stdint.h>

          static int accepted(uint32_t fragment, uint32_t count)
          {
              return fragment < count;
          }

          int main(void)
          {
              assert(accepted(0, 1));
              assert(!accepted(1, 1));
              assert(!accepted(2, 1));
              return 0;
          }
          EOF
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined /tmp/fragment-boundary.c -o /tmp/fragment-boundary
          /tmp/fragment-boundary
